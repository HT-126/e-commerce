services:
  mysql-db:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: always
    environment:
      # Both passwords are REQUIRED: put them in a .env file next to this file
      # (copy .env.example). There is no default, so nobody runs with "root/root" by accident.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_DATABASE: ecommerce         # Tự động tạo database 'ecommerce' khi chạy lần đầu
      # The API uses this limited user (rights only on the 'ecommerce' database), not root.
      # Created on the first start of an EMPTY data volume.
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql          # Lưu trữ dữ liệu để không bị mất khi xoá container
      # Runs only on an EMPTY data volume (first start); existing data is never touched
      - ./data/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # MYSQL_PWD keeps the password off the command line
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    container_name: ecommerce_api
    restart: unless-stopped
    env_file: ./server/.env             # JWT_SECRET etc.
    environment:
      DB_HOST: mysql-db                 # service name, not 127.0.0.1, inside Docker
      DB_USER: shop
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env (see .env.example)}
      DB_NAME: ecommerce
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:5174
    ports:
      - "127.0.0.1:3000:3000"           # only this computer; remove "127.0.0.1:" to share on the network
    healthcheck:
      # The image has no curl, so use Node's fetch
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      mysql-db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    container_name: ecommerce_client
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"             # only this computer
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
